name: AegisOS core checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Test backend and workspace
        run: python -m pytest -q

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Electron
        working-directory: frontend
        run: npm ci

      - name: Check Electron JavaScript
        working-directory: frontend
        run: npm run check

      - name: Configure Electron sandbox
        run: |
          sudo chown root:root frontend/node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 frontend/node_modules/electron/dist/chrome-sandbox

      - name: Install virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Smoke-test Electron renderer
        working-directory: frontend
        run: xvfb-run -a env AEGIS_ELECTRON_SMOKE=1 npm start
